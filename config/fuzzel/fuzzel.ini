[border]
width=3

[colors]
background=1e1e2edd
border=00d1ffff
counter=7f849cff
input=cdd6f4ff
match=00d1ffff
placeholder=7f849cff
prompt=bac2deff
selection=585b70ff
selection-match=00d1ffff
selection-text=cdd6f4ff
text=cdd6f4ff

[main]
dpi-aware=no
font=JetBrainsMono Nerd Font:size=16:weight=extrabold
horizontal-pad=10
icons-enabled=false
width=36
